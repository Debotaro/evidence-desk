[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencedesk"
version = "1.0.0"
description = "Local evidence-grounded knowledge operations with measured hybrid retrieval"
requires-python = ">=3.12"
dependencies = ["fastapi==0.143.2", "uvicorn==0.54.0", "numpy==2.5.4", "fastembed==0.9.0"]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[tool.setuptools.package-data]
evidencedesk = ["static/*", "fixtures/*.json"]

[tool.setuptools.packages.find]
include = ["evidencedesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
