name: Verify EvidenceDesk
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: python -m pytest -q --cov=evidencedesk --cov-report=xml
      - uses: actions/cache@v4
        with:
          path: data/models
          key: minilm-fastembed-0.9.0-v1
      - run: python -m evidencedesk.evaluate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json
      - run: npm ci
        working-directory: ui-tests
      - run: npx playwright install --with-deps chromium
        working-directory: ui-tests
      - run: npm test
        working-directory: ui-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            reports/evaluation.json
            coverage.xml
            ui-tests/playwright-report/
